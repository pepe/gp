image: alpine/latest
triggers:
  - action: email
    condition: failure
    to: "<pe@pan.earth>"
secrets:
- cc1a3890-4696-48f6-bc12-f73d87dd0f20
sources:
- https://git.sr.ht/~bakpakin/janet#v1.33.0
- git@git.sr.ht:~pepe/gp
tasks:
  - janet: |
        cd janet
        export PREFIX="$HOME"/.local
        make -j
        make install
        make install-jpm-git
  - gp: |
        cd gp
        export PREFIX="$HOME"/.local
        export PATH="$PREFIX"/bin:"$PATH"
        jpm -l deps
        jpm -l test

