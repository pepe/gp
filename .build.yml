image: alpine/latest
triggers:
  - action: email
    condition: failure
    to: "<pe@pan.earth>"
secrets:
- cc1a3890-4696-48f6-bc12-f73d87dd0f20
sources:
# Tracking master, not a tag: v1.40.1 hangs on test/events.janet's
# producer-cancellation test (event-loop stream-unregistration bug,
# fixed upstream post-v1.40.1). Switch back to a tagged release once
# a version past that fix ships.
- https://git.sr.ht/~bakpakin/janet#master
- https://github.com/janet-lang/spork.git
- git@git.sr.ht:~pepe/gp
tasks:
  - janet: |
        cd janet
        make -j
        sudo make install
  - spork: |
        cd spork
        sudo janet --install .
  - gp: |
        cd gp
        sudo apk add --no-cache g++
        git submodule update --init --recursive
        sudo /usr/local/lib/janet/bin/janet-pm deps
        /usr/local/lib/janet/bin/janet-pm build
        sudo /usr/local/lib/janet/bin/janet-pm install
        /usr/local/lib/janet/bin/janet-pm test

