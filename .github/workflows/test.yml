name: test

# Like .build.yml, this builds Janet's master branch: v1.40.1 hangs on
# test/events.janet's producer-cancellation test.

on: [push, workflow_dispatch]

jobs:
  posix:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: gp
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: janet-lang/janet
          path: janet
      - uses: actions/checkout@v7
        with:
          repository: janet-lang/spork
          path: spork
      - name: janet
        run: cd janet && make -j4 && sudo make install
      - name: spork
        run: cd spork && sudo janet --install .
      - name: gp
        run: |
          cd gp
          sudo /usr/local/lib/janet/bin/janet-pm deps
          /usr/local/lib/janet/bin/janet-pm build
          sudo /usr/local/lib/janet/bin/janet-pm install
          /usr/local/lib/janet/bin/janet-pm test

  windows:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 30
    # Laid out as Janet's Windows installer would: janet.h and the import
    # libraries in C beside bin, where spork looks from the Library above.
    # JANET_PREFIX stays unset: with it, spork finds the prefix but never
    # records where janet.h is, and declare-native fails its assert.
    env:
      JANET_PATH: C:\janet\Library
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          path: gp
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: janet-lang/janet
          path: janet
      - uses: actions/checkout@v7
        with:
          repository: janet-lang/spork
          path: spork
      - uses: ilammy/msvc-dev-cmd@v1
      # A plain build_win.bat leaves no installable janet.h; dist writes
      # one with janetconf.h folded in (its trailing MSI step may fail).
      - name: janet
        run: |
          cd janet && call build_win.bat || exit /b 1
          call build_win.bat dist || exit /b 1
          mkdir C:\janet\bin C:\janet\C %JANET_PATH% || exit /b 1
          copy dist\janet.exe C:\janet\bin || exit /b 1
          copy dist\janet.lib C:\janet\C || exit /b 1
          copy dist\janet.h C:\janet\C || exit /b 1
          copy dist\libjanet.lib C:\janet\C || exit /b 1
          echo C:\janet\bin>> %GITHUB_PATH%
          echo %JANET_PATH%\bin>> %GITHUB_PATH%
      - name: spork
        run: cd spork && janet --install .
      - name: gp
        run: |
          cd gp
          call janet-pm deps || exit /b 1
          call janet-pm build || exit /b 1
          call janet-pm install || exit /b 1
          call janet-pm test
